<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortLink Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="url"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="url"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
            font-family: monospace;
            font-size: 0.9em;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-copy {
            background: #28a745;
        }

        .btn-copy:hover {
            background: #218838;
        }

        .links-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .link-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .link-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .link-item-title {
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .link-item-short {
            font-family: monospace;
            background: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #667eea;
        }

        .link-item-urls {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .link-item-long {
            color: #999;
            margin-bottom: 5px;
        }

        .link-item-short-url {
            color: #667eea;
            font-weight: 500;
        }

        .link-item-actions {
            display: flex;
            gap: 8px;
        }

        .link-item-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }

        .format-hint {
            font-size: 0.85em;
            color: #999;
            margin-top: 5px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔗 ShortLink Manager</h1>
            <p>Unlimited free URL shortening for Ko-fi and beyond</p>
        </header>

        <div class="main-grid">
            <!-- Create Single Link -->
            <div class="card">
                <h2>Create Link</h2>
                <div id="message-single" class="message"></div>
                
                <div class="form-group">
                    <label for="title">Description/Title</label>
                    <input type="text" id="title" placeholder="e.g., Chapter 1">
                </div>

                <div class="form-group">
                    <label for="url">Long URL</label>
                    <input type="url" id="url" placeholder="https://example.com/very/long/url">
                </div>

                <button onclick="createLink()" id="btn-create">Create Short Link</button>
            </div>

            <!-- Bulk Import -->
            <div class="card">
                <h2>Bulk Import</h2>
                <div id="message-bulk" class="message"></div>
                
                <div class="form-group">
                    <label for="bulk-urls">Paste URLs (one per line)</label>
                    <textarea id="bulk-urls" placeholder="https://example.com/url1 - Title 1&#10;https://example.com/url2 - Title 2"></textarea>
                    <p class="format-hint">Format: URL - Title (title is optional)</p>
                </div>

                <button onclick="bulkImport()" id="btn-bulk">Import Bulk URLs</button>
            </div>
        </div>

        <!-- Links List -->
        <div class="card">
            <h2>Your Links</h2>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="total-links">0</div>
                    <div class="stat-label">Total Links</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="total-clicks">0</div>
                    <div class="stat-label">Total Clicks</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="short-base">shortl.ink</div>
                    <div class="stat-label">Your Domain</div>
                </div>
            </div>

            <div id="links-list" class="links-list" style="margin-top: 20px;">
                <p style="text-align: center; color: #999;">No links yet. Create one to get started!</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://shortlink-ranobe.vercel.app/'; // Replace with your backend URL

        // Load links on page load
        window.addEventListener('DOMContentLoaded', loadLinks);

        async function createLink() {
            const title = document.getElementById('title').value.trim();
            const url = document.getElementById('url').value.trim();
            const msgEl = document.getElementById('message-single');

            if (!url) {
                showMessage(msgEl, 'Please enter a URL', 'error');
                return;
            }

            const btn = document.getElementById('btn-create');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Creating...';

            try {
                const response = await fetch(`${API_URL}/api/links`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, title: title || 'Untitled' })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(msgEl, `✓ Link created: ${data.shortUrl}`, 'success');
                    document.getElementById('title').value = '';
                    document.getElementById('url').value = '';
                    loadLinks();
                } else {
                    showMessage(msgEl, data.error || 'Failed to create link', 'error');
                }
            } catch (err) {
                showMessage(msgEl, 'Error: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Create Short Link';
            }
        }

        async function bulkImport() {
            const text = document.getElementById('bulk-urls').value.trim();
            const msgEl = document.getElementById('message-bulk');

            if (!text) {
                showMessage(msgEl, 'Please paste some URLs', 'error');
                return;
            }

            const lines = text.split('\n').filter(l => l.trim());
            const links = lines.map(line => {
                const parts = line.split(' - ');
                return {
                    url: parts[0].trim(),
                    title: parts[1]?.trim() || 'Untitled'
                };
            }).filter(l => l.url);

            if (!links.length) {
                showMessage(msgEl, 'No valid URLs found', 'error');
                return;
            }

            const btn = document.getElementById('btn-bulk');
            btn.disabled = true;
            btn.innerHTML = `<span class="loading"></span> Importing ${links.length} links...`;

            try {
                const response = await fetch(`${API_URL}/api/links/bulk`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ links })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(msgEl, `✓ Successfully imported ${data.count} links`, 'success');
                    document.getElementById('bulk-urls').value = '';
                    loadLinks();
                } else {
                    showMessage(msgEl, data.error || 'Failed to import links', 'error');
                }
            } catch (err) {
                showMessage(msgEl, 'Error: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Import Bulk URLs';
            }
        }

        async function loadLinks() {
            try {
                const response = await fetch(`${API_URL}/api/links`);
                const data = await response.json();

                const listEl = document.getElementById('links-list');
                const totalLinks = data.links?.length || 0;

                document.getElementById('total-links').textContent = totalLinks;
                document.getElementById('total-clicks').textContent = 
                    data.links?.reduce((sum, l) => sum + (l.clicks || 0), 0) || 0;

                if (!data.links || data.links.length === 0) {
                    listEl.innerHTML = '<p style="text-align: center; color: #999;">No links yet. Create one to get started!</p>';
                    return;
                }

                listEl.innerHTML = data.links.map(link => `
                    <div class="link-item">
                        <div class="link-item-header">
                            <div class="link-item-title">${escapeHtml(link.title)}</div>
                            <div class="link-item-short">${link.code}</div>
                        </div>
                        <div class="link-item-urls">
                            <div class="link-item-long">→ ${escapeHtml(link.url.substring(0, 80))}${link.url.length > 80 ? '...' : ''}</div>
                            <div class="link-item-short-url">🔗 https://shortl.ink/${link.code}</div>
                        </div>
                        <div class="link-item-actions">
                            <button class="btn-copy" onclick="copyToClipboard('https://shortl.ink/${link.code}')">Copy</button>
                            <button class="btn-secondary" onclick="copyToClipboard('${link.code}')">Copy Code</button>
                            <button class="btn-danger" onclick="deleteLink('${link.id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load links:', err);
            }
        }

        async function deleteLink(id) {
            if (!confirm('Delete this link?')) return;

            try {
                const response = await fetch(`${API_URL}/api/links/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadLinks();
                }
            } catch (err) {
                alert('Failed to delete link: ' + err.message);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }

        function showMessage(el, text, type) {
            el.textContent = text;
            el.className = `message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-load links every 5 seconds
        setInterval(loadLinks, 5000);
    </script>
</body>
</html>
